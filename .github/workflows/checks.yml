name: Quality checks

on:
  push:
    branches:
      - master
      - 'dev/**'
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    name: Syntax, HLS regression and package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate sources and build extension
        id: package
        run: |
          npm run verify
          echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Package installable Chromium extension
        env:
          APP_VERSION: ${{ steps.package.outputs.version }}
        run: |
          cd "dist/AtomicTTV-Chromium-$APP_VERSION"
          zip -qr "../AtomicTTV-Chromium-$APP_VERSION.zip" .
          cd ..
          unzip -t "AtomicTTV-Chromium-$APP_VERSION.zip"
      - name: Upload installable extension archive
        uses: actions/upload-artifact@v4
        with:
          name: AtomicTTV-Chromium-${{ steps.package.outputs.version }}
          path: dist/AtomicTTV-Chromium-${{ steps.package.outputs.version }}.zip
          if-no-files-found: error
