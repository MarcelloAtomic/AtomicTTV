name: Tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests and build
        run: npm run verify
      - name: Verify tag matches extension version
        run: |
          APP_VERSION=$(node -p "require('./manifest.json').version")
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"
      - name: Package Chromium MV3 extension
        run: |
          cd dist/AtomicTTV-Chromium-1.0.1
          zip -qr ../AtomicTTV-Chromium-1.0.1.zip .
          cd ..
          unzip -t AtomicTTV-Chromium-1.0.1.zip
      - name: Publish release with installation package
        run: gh release create "$GITHUB_REF_NAME" dist/AtomicTTV-Chromium-1.0.1.zip --generate-notes --title "AtomicTTV $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
