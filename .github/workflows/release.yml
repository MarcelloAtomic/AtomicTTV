name: Tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests and build
        run: npm run verify
      - name: Verify tag matches extension version
        id: package
        run: |
          APP_VERSION=$(node -p "require('./manifest.json').version")
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - name: Package Chromium MV3 extension
        env:
          APP_VERSION: ${{ steps.package.outputs.version }}
        run: |
          cd "dist/AtomicTTV-Chromium-$APP_VERSION"
          zip -qr "../AtomicTTV-Chromium-$APP_VERSION.zip" .
          cd ..
          unzip -t "AtomicTTV-Chromium-$APP_VERSION.zip"
      - name: Publish release with installation package
        run: gh release create "$GITHUB_REF_NAME" "dist/AtomicTTV-Chromium-$APP_VERSION.zip" --generate-notes --title "AtomicTTV $GITHUB_REF_NAME"
        env:
          APP_VERSION: ${{ steps.package.outputs.version }}
          GH_TOKEN: ${{ github.token }}
